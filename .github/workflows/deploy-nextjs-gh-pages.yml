name: Deploy Next.js site to gh-pages

on:
  push:
    branches:
      - main

permissions:
  contents: write  # required so the action can push to gh-pages

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      API_URL: ${{ secrets.API_URL }}
      GITHUB_ACTIONS: true
      GITHUB_REPOSITORY: ${{ github.repository }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build and export
        run: npm run build

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: gh-pages
          force_orphan: true      # smooth first deploy when branch doesn't exist
          enable_jekyll: false    # drops a .nojekyll file
          keep_files: false   # ensure removed files are actually gone
          # cname: your.domain     # (optional) if you use a custom domain
